[[package]]
name = "yata"
version = "0.2.0"
source = { virtual = "." }
dependencies = [
    { name = "av" },
    { name = "fastapi" },
    { name = "faster-whisper" },
    { name = "numpy" },
    { name = "uvicorn" },
    { name = "websockets" },
]

[package.optional-dependencies]
cuda = [
    { name = "nvidia-cublas-cu12", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "nvidia-cudnn-cu12", marker = "sys_platform == 'linux'" },
]
qwen = [
    { name = "torch" },
    { name = "transformers" },
]
speakers = [
    { name = "sherpa-onnx" },
]

[package.dev-dependencies]
bench = [
    { name = "pyarrow" },
]
dev = [
    { name = "httpx" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "av", specifier = ">=18" },
    { name = "fastapi", specifier = ">=0.136" },
    { name = "faster-whisper", specifier = ">=1.2.1" },
    { name = "numpy", specifier = ">=2.5" },
    { name = "nvidia-cublas-cu12", marker = "(sys_platform == 'linux' and extra == 'cuda') or (sys_platform == 'win32' and extra == 'cuda')", specifier = ">=12.9,<12.9.3" },
    { name = "nvidia-cudnn-cu12", marker = "sys_platform == 'linux' and extra == 'cuda'", specifier = ">=9.10,<10" },
    { name = "sherpa-onnx", marker = "extra == 'speakers'", specifier = ">=2.0.1" },
    { name = "torch", marker = "extra == 'qwen'", specifier = ">=2.14", index = "https://download.pytorch.org/whl/cu130" },
    { name = "transformers", marker = "extra == 'qwen'", specifier = ">=5.13" },
    { name = "uvicorn", specifier = ">=0.51" },
    { name = "websockets", specifier = ">=16" },
]
provides-extras = ["qwen", "speakers", "cuda"]

[package.metadata.requires-dev]
bench = [{ name = "pyarrow", specifier = ">=20" }]
dev = [
    { name = "httpx", specifier = ">=0.28" },
    { name = "pytest", specifier = ">=9" },
]
